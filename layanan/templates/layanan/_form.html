{% if form.non_field_errors %}
  <div class="msg error">{% for e in form.non_field_errors %}{{ e }} {% endfor %}</div>
{% endif %}
{% for field in form %}
  <div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<small class="bantuan">{{ field.help_text|safe }}</small>{% endif %}
    {% for e in field.errors %}<div class="galat">{{ e }}</div>{% endfor %}
  </div>
{% endfor %}
