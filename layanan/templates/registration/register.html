{% extends "layanan/base.html" %}
{% block title %}Daftar &middot; Layanan Publik Digital{% endblock %}
{% block content %}
<div class="card form-sempit">
  <h1>Daftar Akun Warga</h1>
  <p class="redup" style="text-align:center">Buat akun untuk mengajukan surat dan mengambil antrean.</p>
  <form method="post">{% csrf_token %}
    {% include "layanan/_form.html" %}
    <button class="btn" type="submit" style="width:100%">Daftar</button>
  </form>
  <p class="tautan-bawah">Sudah punya akun? <a href="{% url 'login' %}">Masuk</a></p>
</div>
{% endblock %}
